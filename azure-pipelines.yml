# Azure DevOps pipeline -> AKS.   check -> build + push images to ACR -> deploy manifests in k8s/ to AKS.
# Needs (one-time, see infra/aks-setup.md):
#   * service connection "sc-pharma-acr"   (Docker Registry -> your ACR)
#   * service connection "sc-pharma-azure" (Azure Resource Manager, scope = the resource group of the AKS)
#   * variable group "pharma-secrets" (Pipelines > Library) with SECRET variables:
#       OPENAI_API_KEY  JWT_SECRET  AZURE_SQL_PASSWORD  AZURE_SEARCH_KEY  AZURE_STORAGE_CONNECTION_STRING  TAVILY_API_KEY  REDIS_KEY
#       (chat memory + exact cache: in-cluster Redis, k8s/20-redis.yaml. Semantic cache: Azure Managed Redis, REDIS_HOST in k8s/10-config.yaml, REDIS_KEY secret)
#   * environment "pharma-prod" (optional approval check)
# Replace the REPLACE_ME values below.

trigger:
  branches:
    include: [main]
  paths:
    exclude: ['README.md', 'Plan/*', 'Data/*']

pr:
  branches:
    include: [main]

pool:
  vmImage: ubuntu-latest

variables:
  - group: pharma-secrets
  - name: acrName
    value: 'pharmastudy'                # ACR name only (no .azurecr.io)
  - name: aksName
    value: 'pharama-study-k8s'   # check spelling in portal
  - name: resourceGroup
    value: 'tufan_rg'                 # resource group of the AKS cluster
  - name: acrServiceConnection
    value: '851e2c61-5253-4c20-96f8-cbbdb233c2f3'   # ACR Docker Registry connection (from the AKS wizard)
  - name: azureServiceConnection
    value: 'sc-pharma-azure'
  - name: namespace
    value: 'pharma'
  - name: imageTag
    value: '$(Build.BuildId)'

stages:
  - stage: Build
    displayName: Check and build images
    jobs:
      - job: Check
        displayName: Quick checks
        steps:
          - task: UsePythonVersion@0
            inputs: { versionSpec: '3.12' }
          - script: python -m compileall -q backend
            displayName: Python syntax check
          - script: node --check frontend/app.js
            displayName: Frontend JS syntax check
          - script: |
              pip install -q pyyaml
              python - <<'PY'
              import glob, yaml
              for f in sorted(glob.glob("k8s/*.yaml")):
                  list(yaml.safe_load_all(open(f)))
                  print("ok", f)
              PY
            displayName: Manifest YAML check
      
      

      - job: Backend
        displayName: Backend image
        dependsOn: Check
        steps:
          - task: Docker@2
            displayName: Build and push pharma-backend
            inputs:
              command: buildAndPush
              containerRegistry: $(acrServiceConnection)
              repository: pharma-backend
              Dockerfile: backend/Dockerfile
              buildContext: $(Build.SourcesDirectory)       # project root (needs backend/ and application_work/)
              tags: |
                $(imageTag)
                latest

      - job: Frontend
        displayName: Frontend image
        dependsOn: Check
        steps:
          - task: Docker@2
            displayName: Build and push pharma-frontend
            inputs:
              command: buildAndPush
              containerRegistry: $(acrServiceConnection)
              repository: pharma-frontend
              Dockerfile: frontend/Dockerfile
              buildContext: $(Build.SourcesDirectory)/frontend
              tags: |
                $(imageTag)
                latest
      
      
      # Evaluation Gate 
      - job: EvalGate
        displayName: Recall quality gate
        dependsOn: Check
        steps:
          - task: UsePythonVersion@0
            inputs: { versionSpec: '3.12' }
          - script: |
              pip install -q -r backend/requirements.txt
              python application_work/run_ragas.py --user-id $(EVAL_USER_ID) --min-recall 0.85 --min-precision 0.80 --min-faithfulness 0.80 --min-relevancy 0.80 \ --min-number-recall 0.70 --min-abstain 0.80
            displayName: Metrics Check 
            env:
              OPENAI_API_KEY: $(OPENAI_API_KEY)
              AZURE_SEARCH_KEY: $(AZURE_SEARCH_KEY)
              AZURE_SEARCH_ENDPOINT: https://tufan-ai-search-v01.search.windows.net
              AZURE_SEARCH_INDEX_NAME: pharma-study-chunks

  - stage: Deploy
    displayName: Deploy to AKS
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: Prod
        displayName: Apply manifests
        environment: pharma-prod
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self          # deployment jobs do not check out the repo by default

                - task: AzureCLI@2
                  displayName: Apply to AKS
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -e
                      az aks get-credentials -g $(resourceGroup) -n $(aksName) --admin --overwrite-existing
                      kubectl apply -f k8s/00-namespace.yaml

                      # secrets come from the variable group, never from Git
                      kubectl -n $(namespace) create secret generic pharma-secrets \
                        --from-literal=OPENAI_API_KEY="$OPENAI_API_KEY" \
                        --from-literal=JWT_SECRET="$JWT_SECRET" \
                        --from-literal=AZURE_SQL_PASSWORD="$AZURE_SQL_PASSWORD" \
                        --from-literal=AZURE_SEARCH_KEY="$AZURE_SEARCH_KEY" \
                        --from-literal=AZURE_STORAGE_CONNECTION_STRING="$AZURE_STORAGE_CONNECTION_STRING" \
                        --from-literal=TAVILY_API_KEY="$TAVILY_API_KEY" \
                        --from-literal=REDIS_KEY="$REDIS_KEY" \
                        --dry-run=client -o yaml | kubectl apply -f -

                      # put this build's image names into the manifests
                      sed -i "s|__ACR__|$(acrName).azurecr.io|g; s|__TAG__|$(imageTag)|g" k8s/*.yaml
                      kubectl apply -f k8s/10-config.yaml -f k8s/20-redis.yaml -f k8s/30-backend.yaml -f k8s/40-frontend.yaml

                      kubectl -n $(namespace) rollout status deploy/backend  --timeout=420s
                      kubectl -n $(namespace) rollout status deploy/frontend --timeout=180s
                  env:
                    OPENAI_API_KEY: $(OPENAI_API_KEY)
                    JWT_SECRET: $(JWT_SECRET)
                    AZURE_SQL_PASSWORD: $(AZURE_SQL_PASSWORD)
                    AZURE_SEARCH_KEY: $(AZURE_SEARCH_KEY)
                    AZURE_STORAGE_CONNECTION_STRING: $(AZURE_STORAGE_CONNECTION_STRING)
                    TAVILY_API_KEY: $(TAVILY_API_KEY)
                    REDIS_KEY: $(REDIS_KEY)

                - task: AzureCLI@2
                  displayName: Smoke test
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -e
                      az aks get-credentials -g $(resourceGroup) -n $(aksName) --admin --overwrite-existing
                      for i in $(seq 1 30); do
                        IP=$(kubectl -n $(namespace) get svc frontend -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
                        [ -n "$IP" ] && break; echo "waiting for public IP ($i)"; sleep 10
                      done
                      echo "Frontend: http://$IP"
                      for i in $(seq 1 12); do
                        UI=$(curl -s -o /dev/null -w "%{http_code}" "http://$IP/" || true)
                        API=$(curl -s -o /dev/null -w "%{http_code}" "http://$IP/api/studies" || true)   # 401 = backend reached, login required
                        echo "try $i: UI=$UI API=$API"
                        if [ "$UI" = "200" ] && [ "$API" = "401" ]; then exit 0; fi
                        sleep 10
                      done
                      echo "Smoke test failed"; exit 1
