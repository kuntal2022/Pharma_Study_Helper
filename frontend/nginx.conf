# nginx template: the official image fills ${BACKEND_URL} from the container's environment at start-up
#   docker / local : BACKEND_URL=http://backend:8000
#   Azure Container Apps (same environment, internal ingress) : BACKEND_URL=http://pharma-backend
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 30m;                 # PDF upload (app limit is 25 MB)

    # API: reading a paper with the LLM takes a minute or more, so long timeouts and no buffering of the upload
    location ~ ^/(api|auth)/ {
        proxy_pass ${BACKEND_URL};
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
    }

    # UI files: never serve a stale app.js/style.css after an update
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
