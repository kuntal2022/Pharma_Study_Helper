# In-cluster Redis for the answer cache and chat memory (data is disposable; swap to Azure Cache for Redis later by changing REDIS_URL).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: pharma
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["--save", "", "--appendonly", "no", "--maxmemory", "200mb", "--maxmemory-policy", "allkeys-lru"]
          ports: [{ containerPort: 6379 }]
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 250m, memory: 256Mi }
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: pharma
spec:
  selector: { app: redis }
  ports: [{ port: 6379, targetPort: 6379 }]
