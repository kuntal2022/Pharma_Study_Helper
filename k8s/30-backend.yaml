# replicas: 1 on purpose. The slide-agent sessions live in the pod's memory, so a second pod would break "revise/approve".
# (Move those sessions to Redis first, then raise replicas.)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: pharma
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: backend
          image: __ACR__/pharma-backend:__TAG__
          ports: [{ containerPort: 8000 }]
          envFrom:
            - configMapRef: { name: pharma-config }
            - secretRef: { name: pharma-secrets }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 2Gi }
          readinessProbe:
            httpGet: { path: /openapi.json, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /openapi.json, port: 8000 }
            initialDelaySeconds: 40
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: backend            # the frontend's nginx default BACKEND_URL is http://backend:8000
  namespace: pharma
spec:
  selector: { app: backend }
  ports: [{ port: 8000, targetPort: 8000 }]
