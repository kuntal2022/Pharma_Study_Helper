# Non-secret settings. Fill the REPLACE_ME values once. Secrets (keys, passwords) are NOT here: the pipeline creates
# the Kubernetes secret "pharma-secrets" from the Azure DevOps variable group.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pharma-config
  namespace: pharma
data:
  REDIS_URL: "redis://redis:6379/0"
  AZURE_SQL_SERVER: "pharmastudy-sql.database.windows.net"
  AZURE_SQL_DATABASE: "pharmastudy-db"
  AZURE_SQL_USERNAME: "pharmaadmin.admin"
  AZURE_SEARCH_ENDPOINT: "https://tufan-ai-search-v01.search.windows.net"
  AZURE_SEARCH_INDEX_NAME: "pharma-study-chunks"
  AZURE_STORAGE_CONTAINER: "pharmastudy"
  OPENAI_CHAT_MODEL: "gpt-4.1-mini"
  OPENAI_EMBEDDING_MODEL: "text-embedding-3-small"
