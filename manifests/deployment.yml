apiVersion : apps/v1
kind: Deployment
metadata:
  name: pharmastudy 
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pharmastudy
  template:
    metadata:
      labels:
        app: pharmastudy 
    spec:
      containers:
        - name: pharmastudy 
          image: pharmastudy.azurecr.io/pharmastudy
          ports:
          - containerPort: 8000