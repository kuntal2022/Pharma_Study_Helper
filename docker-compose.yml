# Pharma Study Analyser - three containers:  redis (answer cache + chat memory)  <-  backend (FastAPI)  <-  frontend (nginx)
#   start : docker compose up --build -d        stop : docker compose down
#   open  : http://localhost:8080
# Secrets come from .env (not baked into images). REDIS_URL below overrides the one in .env.
services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .                      # project root: needs backend/ and application_work/
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "8000"                        # reachable only from the frontend container, not from the host
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data:
